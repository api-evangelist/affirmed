name: Affirmed Networks
description: 'Affirmed Networks is a mobile networking company founded in 2010 (Andover, Massachusetts)
  that pioneered fully virtualized, cloud-native mobile core software for service providers. Its
  portfolio spanned a Virtualized Evolved Packet Core (vEPC), the UnityCloud 5G Core, Private Network
  Service, Network Slicing, and service-automation/analytics tooling, deployed by 100+ mobile operators
  including AT&T, Orange, Vodafone, and Telus. The company was acquired by Microsoft in March 2020 and
  folded into the Azure for Operators initiative; the affirmednetworks.com site now operates as a Microsoft
  company marketing presence with no independent public developer portal or API. Surfaced in the API
  Evangelist network as a portfolio company of Matrix Partners.'
